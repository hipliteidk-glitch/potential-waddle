plugins {
    id 'com.android.application'
}

android {
    namespace 'com.animenotify.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.animenotify.mobile'
        minSdk 24
        targetSdk 28
        versionCode 3
        versionName '1.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
